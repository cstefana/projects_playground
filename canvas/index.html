<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Shapes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Window State Display -->
    <div id="windowState" class="window-state">
        <div class="window-state-header">Window State</div>
        <div class="window-state-content">
            <div class="state-item">
                <span class="state-label">Inner Size:</span>
                <span id="innerSize" class="state-value">0×0</span>
            </div>
            <div class="state-item">
                <span class="state-label">Mouse:</span>
                <span id="mousePos" class="state-value">0, 0</span>
            </div>
            <div class="state-item">
                <span class="state-label">Canvas set size:</span>
                <span id="canvasSize" class="state-value">0×0</span>
            </div>
            <div class="state-item">
                <span class="state-label">Canvas CSS:</span>
                <span id="canvasDisplaySize" class="state-value">0×0</span>
            </div>
        </div>
    </div>

    <!-- Shape Buttons -->
    <div class="shape-buttons">
        <h3>Add Shapes</h3>
        <div class="shape-button-grid">
            <button id="addRect">Rectangle</button>
            <button id="addSquare">Square</button>
            <button id="addCircle">Circle</button>
            <button id="addTriangle">Triangle</button>
            <button id="addEllipse">Ellipse</button>
            <button id="addStar">Star</button>
        </div>
    </div>

    <h1>Shape Designer</h1>

    <div class="controls">
        <button id="clearCanvas">Clear All</button>
        <button id="toggleCollision" class="toggle-btn">Collision Avoidance: OFF</button>
        <button id="savePdf">Save as PDF</button>
    </div>

    <div class="main-layout">
        <div class="canvas-container">
            <canvas id="myCanvas" width="800" height="500"></canvas>
        </div>
    </div>

    <script type="module" src="/src/app-initializer.ts"></script>
</body>
</html>
