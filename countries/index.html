<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country explorer</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/history.css">
    <link rel="stylesheet" href="styles/starred.css">
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn active" onclick="showHome()">Home</button>
        <button class="nav-btn" onclick="showHistory()">History</button>
        <button class="nav-btn" onclick="showStarred()">Starred</button>
    </nav>

    <div id="home" class="page">
        <div class="container">
            <h1>Country explorer</h1>
            <div class="search-box">
                <input type="text" class="country-input" placeholder="Enter country name">
                <button onclick="searchCountry()">Search</button>
            </div>

            <div class="result"></div>
        </div>
    </div>

    <div id="history" class="page" style="display: none;">
        <div class="container">
            <h1>Search History</h1>
            <ul class="history-list"></ul>
        </div>
    </div>

    <div id="starred" class="page" style="display: none;">
        <div class="container">
            <h1>Starred Countries</h1>
            <ul class="starred-list"></ul>
        </div>
    </div>

    <script src="scripts/cache.js"></script>
    <script src="scripts/country.js"></script>
    <script src="scripts/history.js"></script>
    <script src="scripts/star.js"></script>
</body>
</html>
