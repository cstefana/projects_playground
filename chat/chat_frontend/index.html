<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>🌿 Welcome to the Sage Side</h2>
            <input type="text" id="username-input" placeholder="Enter your username" />
            
            <div class="avatar-selection">
                <p style="margin: 10px 0 5px 0; font-size: 0.9em; color: #555;">Choose your avatar:</p>
                <div class="avatar-grid">
                    <img src="images/plants1.avif" class="avatar-option" data-avatar="images/plants1.avif" alt="Plant 1">
                    <img src="images/plants2.avif" class="avatar-option" data-avatar="images/plants2.avif" alt="Plant 2">
                    <img src="images/plants3.avif" class="avatar-option" data-avatar="images/plants3.avif" alt="Plant 3">
                </div>
                <input type="text" id="custom-avatar-input" placeholder="Or paste image URL" />
            </div>
            
            <button id="login-btn">Join Chat</button>
        </div>
    </div>

    <!-- desktop layout -->
    <div id="main-wrapper" style="display: none;">
        <div id="sidebar">
            <div class="desktop-title">
                <h1>🌿 Sage Chat</h1>
            </div>
            <h3 class="people-header">People</h3>
            <ul id="user-list">
                </ul>
        </div>

    <div id="chat-container">
        <div id="chat-header">Select a conversation</div>
        
        <div id="messages">
            <div id="no-selection-notice">
                <p>Please select a user from the sidebar to start chatting.</p>
            </div>
        </div>

        <div id="input-area" style="display: none;">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button id="emoji-btn" class="emoji-btn" title="Add emoji">😊</button>
            <button id="send-btn">Send</button>
        </div>
        
        <!-- Emoji Picker Popup -->
        <div id="emoji-picker-container" class="emoji-picker-container" style="display: none;">
            <emoji-picker id="emoji-picker"></emoji-picker>
        </div>
    </div>
    </div>
    
    <!-- Mobile Layout -->
    <div class="mobile-user-selection" id="mobile-user-selection">
        <div class="mobile-header">
            <h1>🌿 Sage Chat</h1>
            <p>Choose someone to chat with</p>
        </div>
        <div class="mobile-user-list" id="mobile-user-list">
            <!-- mobile user list will be populated here -->
        </div>
    </div>
    
    <div class="mobile-chat-view" id="mobile-chat-view">
        <div class="mobile-chat-header">
            <button class="back-button" id="mobile-back-btn">←</button>
            <div class="mobile-chat-user-info">
                <img class="mobile-chat-avatar" id="mobile-chat-avatar" src="" alt="">
                <h2 class="mobile-chat-name" id="mobile-chat-name"></h2>
            </div>
        </div>
        <div id="mobile-messages">
            <!-- messages will be populated here -->
        </div>
        <div class="mobile-input-area" id="mobile-input-area">
            <input type="text" id="mobile-message-input" placeholder="Type a message...">
            <button id="mobile-emoji-btn" class="emoji-btn" title="Add emoji">😊</button>
            <button id="mobile-send-btn">Send</button>
        </div>
        
        <!-- Mobile Emoji Picker Popup -->
        <div id="mobile-emoji-picker-container" class="emoji-picker-container" style="display: none;">
            <emoji-picker id="mobile-emoji-picker"></emoji-picker>
        </div>
    </div>
    
    <script src="scripts/user_class.js"></script>
    <script src="scripts/websocket_client.js"></script>
    <script src="scripts/user_utilities.js"></script>
    <script src="scripts/mobile_utilities.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <script src="scripts/emoji_picker.js"></script>
</body>
</html>
